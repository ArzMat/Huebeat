[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "huebeat"
version = "0.1.0"
description = "Sync musica-luci Philips Hue in tempo reale via Entertainment API"
requires-python = ">=3.15"
dependencies = [
    "pydantic-settings>=2.2",
    "httpx",
    # Primitive AES-GCM/HMAC del trasporto DTLS interno (huebeat/dtls.py);
    # sostituisce python-mbedtls, rotta dal firmware bridge 1.79.
    "cryptography>=42",
    "PyAudioWPatch",
    "numpy",
    "keyboard",
    # Frontend di controllo (comando `app`): finestra nativa e tray.
    "pywebview>=5",
    "pystray",
    "Pillow",  # richiesta da pystray per l'icona
    # Cattura per-processo: enumerazione delle sessioni audio (PID + nome app).
    "pycaw",
    # Risoluzione del PID radice (risalita ai genitori) per l'aggancio dell'helper
    # all'intero albero di processi dell'app (Chrome). Gia' trascinata da pycaw,
    # qui dichiarata perche' usata direttamente (process_audio.resolve_pid).
    "psutil",
]

# Il repo ha altre cartelle in radice (native, assets, scripts): senza questa
# scelta esplicita la discovery flat-layout di setuptools fa fallire l'install.
[tool.setuptools.packages.find]
include = ["huebeat*"]

[tool.setuptools.package-data]
huebeat = ["webui/*.html"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # errori PEP8
    "F",   # pyflakes (variabili/import non usati)
    "W",   # warnings
    "I",   # ordinamento import
    "B",   # bugbear (anti-pattern)
    "UP",  # pyupgrade (sintassi moderna)
]
